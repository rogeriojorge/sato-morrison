name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      nonuniform:
        description: Run the complete nonuniform evolution campaign
        type: boolean
        default: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
        env:
          JAX_ENABLE_X64: 'true'
          MPLBACKEND: Agg
  nonuniform:
    if: github.event_name == 'workflow_dispatch' && inputs.nonuniform
    uses: ./.github/workflows/nonuniform.yml
