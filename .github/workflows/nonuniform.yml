name: nonuniform evolution
on: workflow_call
permissions:
  contents: read
jobs:
  evolution:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Record runner and installed environment
        run: |
          mkdir -p results/nonuniform_evolution
          lscpu > results/nonuniform_evolution/cpu.txt
          python -m pip freeze > results/nonuniform_evolution/environment.txt
          git rev-parse HEAD > results/nonuniform_evolution/commit.txt
      - name: Evolve all three fields and independent refinements
        run: |
          set -o pipefail
          python -u examples/12_nonuniform_evolution.py 2>&1 | tee results/nonuniform_evolution/run.log
        env:
          JAX_ENABLE_X64: 'true'
          MPLBACKEND: Agg
      - name: Preserve complete or partial measured evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nonuniform-evolution-${{ github.sha }}
          path: results/nonuniform_evolution/
          if-no-files-found: error
