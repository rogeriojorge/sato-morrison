[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sato-morrison"
version = "0.1.0"
description = "Verified prototypes for magnetic-moment-constrained collision models"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["numpy", "jax", "solvax>=0.28.2", "scipy"]

[project.optional-dependencies]
dev = ["pytest", "matplotlib", "psutil"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
