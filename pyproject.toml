[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sato-morrison"
version = "0.0.0"
description = "Reference calculations for magnetic-moment-constrained collision models"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
